<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Andrew Snell</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.contact-page {
  max-width: 760px;
  margin: 70px auto 100px;
}
.contact-page h1 {
  margin-bottom: 18px;
}
.contact-page .intro {
  margin-bottom: 38px;
}
.contact-form label {
  display: block;
  margin: 20px 0 7px;
}
.contact-form input,
.contact-form textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  background: #111;
  color: #fff;
  border: 1px solid #777;
  font: inherit;
}
.contact-form textarea {
  min-height: 180px;
  resize: vertical;
}
.contact-form button {
  margin-top: 24px;
  padding: 11px 28px;
  background: transparent;
  color: #fff;
  border: 1px solid #b89b5e;
  font: inherit;
  cursor: pointer;
}
</style>
</head>

<body>

<header class="top">
  <div class="wrap nav">
    <a class="brand" href="home.html">ANDREW SNELL <small>/ DOCUMENTARY FILMMAKER</small></a>
    <nav class="links">
      <a href="recent-work.html">RECENT WORK</a>
      <a href="films.html">FILMS</a>
      <a href="fractured-worlds.html">FRACTURED WORLDS</a>
      <a href="highlights.html">HIGHLIGHTS & AWARDS</a>
      <a href="biography.html">ABOUT</a>
      <a href="training.html">TRAINING</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="contact-page">
    <h1>Contact</h1>

    <p class="intro">For enquiries about films, archive material, screenings, training and consultancy, please get in touch.</p>

   <form class="contact-form" id="contact-form">
      <label for="name">Name</label>
     <input id="name" name="fi-sender-fullName" type="text" required>

      <label for="email">Email</label>
    <input id="email" name="fi-sender-email" type="email" required>

      <label for="message">Message</label>
    <textarea id="message" name="fi-text-message" required></textarea>

     <button type="submit">SEND</button>
    </form>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 Andrew Snell.</span>
    <span>ARCHIVE &nbsp;&nbsp; CONTACT</span>
  </div>
</footer>
<script src="https://forminit.com/sdk/v1/forminit.js"></script>
<script>
  const forminit = new Forminit();
  const form = document.getElementById('contact-form');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const { data, error } = await forminit.submit('9bo8y3p4d0d', new FormData(form));

    if (error) {
      alert('Sorry, your message could not be sent. Please try again.');
      return;
    }

    alert('Thank you. Your message has been sent.');
    form.reset();
  });
</script>
</body>
  
</html>
